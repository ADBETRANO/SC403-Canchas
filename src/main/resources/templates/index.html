<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <div class="container contenido-golazo pt-4 pb-5">
            <section class="hero-golazo p-4 p-md-5">
                <span class="etiqueta-hero"><i class="fa-solid fa-bolt"></i> [[#{index.etiqueta}]]</span>
                <h1 class="mt-3 mb-3">[[#{index.titulo}]]</h1>
                <p class="mb-0" style="max-width: 672px;">[[#{index.lema}]]</p>
                <a class="btn btn-light btn-sm fw-bold mt-3 text-golazo" th:href="@{/reserva/disponibilidad}">
                    <i class="fa-regular fa-calendar-plus"></i> [[#{index.reservarAhora}]]</a>
            </section>

            <section th:replace="~{catalogo/fragmentos :: filtros}"></section>
            <section th:replace="~{catalogo/fragmentos :: tarjetas}"></section>
        </div>

        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
