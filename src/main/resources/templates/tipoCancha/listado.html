<!DOCTYPE html>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <div class="admin-golazo">
            <aside th:replace="~{general/fragmentos :: menuAdmin('tipos')}"></aside>
            <main class="admin-contenido">
                <section th:replace="~{tipoCancha/fragmentos :: formulario}"></section>
                <section th:replace="~{tipoCancha/fragmentos :: listado}"></section>
            </main>
        </div>

        <section th:replace="~{general/fragmentos :: confirmarEliminar(@{/tipoCancha/eliminar},'idTipoCancha')}"></section>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>

        <script th:src="@{/js/modulos/tipoCancha.js}"></script>
    </body>
</html>
