spring.application.name=golazo
server.port=80
#Se define el formato de fecha/hora del log del servidor web
logging.pattern.dateformat=HH:mm:ss

#Se define no presentar el banner de SPRING en el log del servidor
spring.main.banner-mode=off

#La sesión se maneja solo con cookie (evita ;jsessionid en la URL)
server.servlet.session.tracking-modes=cookie

#Se evita el uso de cache en desarrollo en producción si se debe usar.
spring.thymeleaf.cache=false

#Conexión local a la BD Golazo en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/golazo
#Conexión NUBE AIVEN a la BD Golazo en MySQL
spring.datasource.url=jdbc:mysql://techshop-mysql-adrianvalverde100-54bc.h.aivencloud.com:28631/golazo?sslMode=REQUIRED

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_golazo
spring.datasource.password=Golaz0_Clave.

#Formato en que llegan las fechas y horas de los formularios (<input type="date"> y <input type="time">)
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Esta información se utiliza para obtener acceso a su storage.
# La llave .json NO se sube a GitHub: el coordinador la pasa por privado
# y cada integrante la copia en src/main/resources/firebase/
firebase.bucket.name=techshop-a8349.firebasestorage.app
firebase.storage.path=golazo
firebase.json.path=firebase
firebase.json.file=techshop-a8349-firebase-adminsdk-fbsvc-ecfd3b780d.json
